  '<div class="opts" style="margin-bottom:16px">'+opt('res','won','수주','계약 10/02',f=='won')+opt('res','lost','실주','',f=='lost')+opt('res','wait','아직 결과 없음','',f=='wait')+'</div>'+extra,
  f:'<button class="btn ghost" type="button" data-go="skip">나중에</button><button class="btn pri" type="button" data-done="result" '+(f&&f!='wait'?'':'disabled style="opacity:.4"')+'>'+(f=='lost'?'실주 등록':'결과 등록')+'</button>',
  ok:f=='lost'?['실주 등록 · 실패요인 분석 업무 생성','계열·고객사 이력에 반영']:['WO-2026-0031 생성 · 수주로 표시','실행예산 작성 업무 배정','고객사·계열 이력에 수주 반영']}}
};

function home(){
 var roles=['전체','영업지원','영업담당','견적담당','임원'];
 var list=TASKS.filter(function(t){return S.role=='전체'||t.role==S.role});
 var n=doneCount(),first=nextOpen(-1);
 document.getElementById('bar').innerHTML=bar(-1);
 document.getElementById('page').innerHTML='<div class="hello">10월 15일(목) · 예시 데이터</div><h1 style="margin-top:4px">오늘 할 일 '+(TASKS.length-n)+'건</h1><p class="lead" style="margin-bottom:12px">한 화면에서 한 가지만 처리합니다. 끝나면 다음 업무로 넘어갑니다.</p>'+
  '<div class="seg">'+roles.map(function(r){return '<button type="button" data-role="'+r+'" class="'+(S.role==r?'on':'')+'">'+r+'</button>'}).join('')+'</div>'+
  '<div class="prog" aria-label="진행률"><i style="width:'+Math.round(n/TASKS.length*100)+'%"></i></div>'+
  '<div class="tasks">'+list.map(function(t){var i=idx(t.id),d=S.done[t.id];return '<a class="task'+(d?' isdone':'')+'" href="#t/'+t.id+'"><span class="n">'+(d?'✓':(i+1))+'</span><span style="min-width:0"><span class="tt">'+t.title+'</span><span class="ds" style="display:block">'+t.desc+'</span></span><span class="rt">'+(t.due&&!d?'<span class="due">'+t.due+'</span>':'')+'<span class="min">'+t.role+' · 약 '+t.min+'분</span></span></a>'}).join('')+'</div>'+'<div style="margin-top:28px;font-weight:800">상세 견적서</div><div class="estl"><a href="#est/civil"><b>공사 견적서</b><span>S-OIL 온산 TA 배관 2026 · QP-2026-0063</span></a><a href="#est/tank"><b>탱크 제작 견적서</b><span>한빛케미칼 울산 저장탱크 4기 · QP-2026-0058</span></a></div>'+roleFoot('home');
 foot(first>=0?'<button class="btn pri" type="button" data-start="'+TASKS[first].id+'">'+(n?'이어서 하기':'시작하기')+' · '+TASKS[first].title+'</button>':'<button class="btn okb" type="button" data-reset="1">오늘 할 일을 모두 끝냈습니다 · 처음부터 다시 보기</button>');
}
function task(id){
 var i=idx(id);if(i<0)return home();var t=TASKS[i];var v=VIEWS[id](t);
 document.getElementById('bar').innerHTML=bar(i);
 if(S.done[id]){var nx=nextOpen(i);
  document.getElementById('page').innerHTML='<div class="done"><div class="ic">'+CHECK+'</div><h1>'+t.title+' 완료</h1><p class="lead" style="margin:0">'+t.desc+'</p><ul>'+S.done[id].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'+roleFoot(id);
  foot('<a class="btn" href="#home">업무함</a>'+(nx>=0?'<button class="btn pri" type="button" data-start="'+TASKS[nx].id+'">다음 업무 · '+TASKS[nx].title+' ›</button>':'<a class="btn okb" href="#home">오늘 할 일 끝</a>'));
 }else{document.getElementById('page').innerHTML=v.h+roleFoot(id);foot(v.f);S.cur=v}
 window.scrollTo(0,0);
}
function render(){var h=location.hash.slice(1);document.getElementById('page').classList.remove('wide');if(h.indexOf('est/')==0)est(h.slice(4)=='tank'?'tank':'civil');else if(h.indexOf('t/')==0)task(h.slice(2));else home()}
document.addEventListener('click',function(e){
 var el=e.target.closest('button,[data-f]');if(!el)return;
 if(el.hasAttribute('data-role')){S.role=el.getAttribute('data-role');home();return}
 if(el.hasAttribute('data-start')){location.hash='t/'+el.getAttribute('data-start');return}
 if(el.hasAttribute('data-reset')){S.done={};S.f={};home();return}
 if(el.hasAttribute('data-seg')){S.f[el.getAttribute('data-seg')]=el.getAttribute('data-v');render();return}
 if(el.hasAttribute('data-done')){var id=el.getAttribute('data-done');var v=VIEWS[id](TASKS[idx(id)]);S.done[id]=v.ok;render();return}
 if(el.getAttribute('data-go')=='skip'){var i=idx(location.hash.slice(3));var nx=nextOpen(i);location.hash=nx>=0&&nx!=i?'t/'+TASKS[nx].id:'home';return}
 if(el.getAttribute('data-go')=='gate-c'){location.href='gate-c.html#deal';return}
});
document.addEventListener('change',function(e){var el=e.target;
 if(el.hasAttribute('data-f')){S.f[el.getAttribute('data-f')]=el.value;render()}
 if(el.hasAttribute('data-c')){S.f[el.getAttribute('data-c')]=el.checked;el.closest('.opt').classList.toggle('on',el.checked)}
});
window.addEventListener('hashchange',render);render();
})();
</script>
</body>
</html>
