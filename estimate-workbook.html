<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상세 견적서 · 견적 워크북</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F5F6F8;--surf:#fff;--ink:#101828;--sub:#667085;--faint:#98A2B3;--line:#E4E7EC;
  --grid:#E3E5E8;--hdr:#F2F3F5;--hdr-on:#DCE7DF;--hdr-ink:#475467;
  --acc:#1F6F43;--acc-w:#E7F2EB;--sel:#1F6F43;--sel-w:rgba(31,111,67,.10);
  --g-cover:#667085;--g-check:#2457C5;--g-est:#1F6F43;--g-ex:#C2410C;--g-ref:#7C3AED;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
a{color:#2457C5;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── top bar ── */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surf);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);font-weight:600;white-space:nowrap}
.back:hover{background:var(--bg)}
.ttl{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 320px}
.ico{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--acc);color:#fff;font-weight:800;font-size:13px}
.ttl b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--bg);color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#185836;color:#fff}

/* ── formula bar ── */
.fx{display:flex;align-items:stretch;background:var(--surf);border-bottom:1px solid var(--line);min-height:34px}
.nbox{flex:none;width:92px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.fxl{flex:none;display:flex;align-items:center;padding:0 10px;color:var(--faint);font-style:italic;font-weight:700;border-right:1px solid var(--line);font-family:Georgia,serif}
.fxv{flex:1;min-width:0;display:flex;align-items:center;padding:4px 12px;white-space:nowrap;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Consolas,'D2Coding',monospace;font-size:12.5px}
.fxv.txt{font-family:inherit;font-size:13px}
.legend{flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--sub);font-size:11.5px;border-left:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ── grid ── */
.gridwrap{flex:1;min-height:0;overflow:auto;background:var(--surf);position:relative}
table.sh{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12.5px;line-height:1.4}
table.sh th,table.sh td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0}
table.sh thead th{position:sticky;top:0;z-index:3;height:24px;background:var(--hdr);color:var(--hdr-ink);font-weight:500;font-size:11.5px;text-align:center;user-select:none}
table.sh th.rn{position:sticky;left:0;z-index:2;width:46px;min-width:46px;background:var(--hdr);color:var(--hdr-ink);font-weight:500;font-size:11.5px;text-align:center;user-select:none}
table.sh thead th.corner{left:0;z-index:4;width:46px}
table.sh th.on{background:var(--hdr-on);color:var(--acc);font-weight:700}
table.sh tr.frz td{position:sticky;top:25px;z-index:1;box-shadow:0 1px 0 #C8CCD2}
table.sh tr.frz th.rn{top:25px;z-index:3;box-shadow:0 1px 0 #C8CCD2}
td.c{height:23px;vertical-align:middle;position:relative;background-clip:padding-box;cursor:cell}
td.c > div{padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.c > div.sp{position:relative;z-index:2;overflow:hidden}
td.c.w > div{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
td.c.bd{border-right-color:#C9CDD3;border-bottom-color:#C9CDD3}
td.c.hr > div{text-align:right;font-variant-numeric:tabular-nums}
td.c.hc > div{text-align:center}
td.c.dv::after{content:"▾";position:absolute;right:3px;bottom:2px;font-size:9px;color:#98A2B3}
td.c.fm > div{}
td.c.insel{background-image:linear-gradient(var(--sel-w),var(--sel-w))}
td.c.act{outline:2px solid var(--sel);outline-offset:-2px;z-index:1}
td.c a{color:#0563C1;text-decoration:underline}

/* ── bottom: tabs + status ── */
.bottom{flex:none;background:var(--hdr);border-top:1px solid var(--line)}
.tabsrow{display:flex;align-items:stretch;min-height:36px}
.tnav{flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line)}
.tnav button{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--sub);font-size:12px}
.tnav button:hover{background:#E4E7EC;color:var(--ink)}
.tabs{flex:1;min-width:0;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:thin;scroll-behavior:smooth}
.tab{flex:none;position:relative;display:flex;align-items:center;gap:6px;padding:0 14px;min-height:36px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--hdr-ink);font-weight:500;white-space:nowrap}
.tab::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gc);opacity:.55}
.tab:hover{background:#E9EBEE;color:var(--ink)}
.tab.on{background:var(--surf);color:var(--acc);font-weight:700;box-shadow:inset 0 -2px 0 var(--acc)}
.tab.on::before{opacity:1}
.tab .gdot{width:7px;height:7px;border-radius:50%;background:var(--gc)}
.status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:28px;padding:0 12px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;background:#F8F9FA}
.status .sp{flex:1}
.status b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.zoom{display:flex;align-items:center;gap:6px}
.zoom button{width:24px;height:22px;border:1px solid var(--line);border-radius:5px;background:var(--surf);font-size:13px;line-height:1}
.zoom input{width:110px;accent-color:var(--acc)}
.zoom span{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#101828;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

@media (max-width:720px){
  .legend{display:none}
  .acts .btn span{display:none}
  .zoom input{width:70px}
}
@media print{
  .top,.fx,.bottom{display:none}
  .app{height:auto}
  .gridwrap{overflow:visible}
  table.sh thead,th.rn{display:none}
  td.c.act{outline:none}
  td.c.insel{background-image:none}
}
</style>
</head>

    select(1,1,1,1);
  }

  // ── selection ──
  function norm(k){return anchorOf[k]||k}
  function select(r1,c1,r2,c2){
    var k = norm(r1+','+c1), p = k.split(',');
    sel = {r1:Math.min(r1,r2),c1:Math.min(c1,c2),r2:Math.max(r1,r2),c2:Math.max(c1,c2),ar:+p[0],ac:+p[1]};
    paint();
  }
  function paint(){
    gw.querySelectorAll('.insel,.act').forEach(function(el){el.classList.remove('insel','act')});
    gw.querySelectorAll('th.on').forEach(function(el){el.classList.remove('on')});
    if(!sel) return;
    var s = SH[cur], nums = [], cnt = 0;
    for(var r=sel.r1;r<=sel.r2;r++)for(var c=sel.c1;c<=sel.c2;c++){
      var k=r+','+c, td=cellMap[k];
      if(td && (sel.r1!==sel.r2||sel.c1!==sel.c2)) td.classList.add('insel');
      var cell=s.cells[k]; if(cell && cell.d!==''){cnt++; if(typeof cell.n==='number') nums.push(cell.n);}
    }
    var act = cellMap[sel.ar+','+sel.ac]; if(act) act.classList.add('act');
    for(c=sel.c1;c<=sel.c2;c++){var th=gw.querySelector('thead th[data-c="'+c+'"]'); if(th) th.classList.add('on')}
    for(r=sel.r1;r<=sel.r2;r++){var rh=gw.querySelector('th.rn[data-r="'+r+'"]'); if(rh) rh.classList.add('on')}
    var multi = sel.r1!==sel.r2||sel.c1!==sel.c2;
    document.getElementById('nbox').textContent = multi ? addr(sel.r1,sel.c1)+':'+addr(sel.r2,sel.c2) : addr(sel.ar,sel.ac);
    var cell = s.cells[sel.ar+','+sel.ac], fx = document.getElementById('fxv');
    if(cell && cell.x){fx.className='fxv'; fx.textContent=cell.x;}
    else {fx.className='fxv txt'; fx.textContent = cell ? (typeof cell.n==='number' ? String(cell.n) : cell.d) : '';}
    var agg = document.getElementById('st-agg');
    if(multi && nums.length){
      var sum = nums.reduce(function(a,b){return a+b},0);
      var f = function(x){return x.toLocaleString('ko-KR',{maximumFractionDigits:2})};
      agg.innerHTML = '평균: <b>'+f(sum/nums.length)+'</b> &nbsp; 개수: <b>'+cnt+'</b> &nbsp; 합계: <b>'+f(sum)+'</b>';
    } else if(multi){ agg.innerHTML = '개수: <b>'+cnt+'</b>'; }
    else agg.textContent = '';
  }
  function tdPos(td){var p=norm(td.dataset.k).split(',');return [+p[0],+p[1]]}
  gw.addEventListener('mousedown',function(e){
    var td=e.target.closest('td.c'); if(!td || e.target.closest('a')) return;
    var p=tdPos(td);
    if(e.shiftKey && anchor){ sel={r1:Math.min(anchor[0],p[0]),c1:Math.min(anchor[1],p[1]),r2:Math.max(anchor[0],p[0]),c2:Math.max(anchor[1],p[1]),ar:anchor[0],ac:anchor[1]}; paint(); }
    else { anchor=p; select(p[0],p[1],p[0],p[1]); }
    dragging=true; e.preventDefault(); gw.focus();
  });
  gw.addEventListener('mouseover',function(e){
    if(!dragging) return; var td=e.target.closest('td.c'); if(!td) return;
    var p=tdPos(td), m=SH[cur].merges.filter(function(x){return x[0]===p[0]&&x[1]===p[1]})[0];
    var r2=m?p[0]+m[2]-1:p[0], c2=m?p[1]+m[3]-1:p[1];
    sel={r1:Math.min(anchor[0],p[0]),c1:Math.min(anchor[1],p[1]),r2:Math.max(anchor[0],r2),c2:Math.max(anchor[1],c2),ar:anchor[0],ac:anchor[1]}; paint();
  });
  document.addEventListener('mouseup',function(){dragging=false});
  gw.addEventListener('mousedown',function(e){
    var th=e.target.closest('thead th[data-c]'); if(th){var c=+th.dataset.c; anchor=[1,c]; select(1,c,SH[cur].rows,c); sel.ar=1; sel.ac=c; paint(); return;}
    var rh=e.target.closest('th.rn'); if(rh){var r=+rh.dataset.r; anchor=[r,1]; select(r,1,r,SH[cur].cols); sel.ar=r; sel.ac=1; paint();}
  });
  gw.tabIndex = 0;

  // ── keyboard ──
  function move(dr,dc,extend){
    var s=SH[cur], R=s.rows+8, C=s.cols+3;
    if(extend){
      var nr1=sel.r1,nr2=sel.r2,nc1=sel.c1,nc2=sel.c2;
      if(dr){ if(sel.r1===sel.ar) nr2=Math.min(R,Math.max(sel.ar,sel.r2+dr)); else nr1=Math.max(1,sel.r1+dr); if(sel.r1===sel.ar&&nr2<sel.ar){nr2=sel.ar} }
      if(dc){ if(sel.c1===sel.ac) nc2=Math.min(C,Math.max(sel.ac,sel.c2+dc)); else nc1=Math.max(1,sel.c1+dc); }
      sel.r1=nr1;sel.r2=nr2;sel.c1=nc1;sel.c2=nc2; paint(); return;
    }
    var r=sel.ar, c=sel.ac, m=s.merges.filter(function(x){return x[0]===r&&x[1]===c})[0];
    if(dr>0&&m) r=r+m[2]-1; if(dc>0&&m) c=c+m[3]-1;
    r=Math.min(R,Math.max(1,r+dr)); c=Math.min(C,Math.max(1,c+dc));
    var k=norm(r+','+c).split(','); anchor=[+k[0],+k[1]]; select(+k[0],+k[1],+k[0],+k[1]);
    var td=cellMap[k.join(',')]; if(td) td.scrollIntoView({block:'nearest',inline:'nearest'});
  }
  document.addEventListener('keydown',function(e){
    if(e.target.closest('input')) return;
    if((e.ctrlKey||e.metaKey) && e.key==='PageDown'){e.preventDefault();show(Math.min(SH.length-1,cur+1));return}
    if((e.ctrlKey||e.metaKey) && e.key==='PageUp'){e.preventDefault();show(Math.max(0,cur-1));return}
    if((e.ctrlKey||e.metaKey) && e.key==='Home'){e.preventDefault();anchor=[1,1];select(1,1,1,1);gw.scrollTop=0;gw.scrollLeft=0;return}
    if((e.ctrlKey||e.metaKey) && (e.key==='c'||e.key==='C')){copySel();e.preventDefault();return}
    var map={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],Enter:[e.shiftKey?-1:1,0],Tab:[0,e.shiftKey?-1:1]};
    if(map[e.key] && sel){e.preventDefault(); move(map[e.key][0],map[e.key][1], e.shiftKey && e.key.indexOf('Arrow')===0);}
  });
  function copySel(){
    if(!sel) return; var s=SH[cur], lines=[];
    for(var r=sel.r1;r<=sel.r2;r++){var row=[];for(var c=sel.c1;c<=sel.c2;c++){var cell=s.cells[r+','+c];row.push(cell?cell.d:'')}lines.push(row.join('\t'))}
    var t=lines.join('\n');
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){toast('선택 영역을 복사했습니다')},function(){toast('복사할 수 없습니다')});
  }

  // ── zoom / print ──
  var zr=document.getElementById('zr');
  function applyZoom(){var t=document.getElementById('tbl'); if(t) t.style.zoom=zoom/100; zr.value=zoom; document.getElementById('zv').textContent=zoom+'%'}
  zr.oninput=function(){zoom=+zr.value;applyZoom()};
  document.getElementById('zin').onclick=function(){zoom=Math.min(160,zoom+10);applyZoom()};
  document.getElementById('zout').onclick=function(){zoom=Math.max(60,zoom-10);applyZoom()};
  document.getElementById('print').onclick=function(){window.print()};

  // ── start ──
  var want = q.get('sheet') || VIEW[q.get('view')] || '총괄표';
  var idx = SH.findIndex(function(s){return s.name===want}); show(idx<0?0:idx);
})();
</script>
</body>
</html>
