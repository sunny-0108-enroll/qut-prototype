<!-- est-workbook-hook:start -->
<script>
/* 상세 견적서 라우트(#EstCivil, #est/civil 등)를 엑셀형 견적 워크북 화면으로 연결 */
(function(){
  var GATE = 'gate-c';
  var RX = /^#(?:Est(Civil|Tank)|est[-\/](civil|tank))(?:$|[\/?&])/;
  function url(hash, back){
    var tank = /tank/i.test(hash);
    return 'estimate-workbook.html?view=' + (tank ? 'tank' : 'civil') + '&from=' + GATE + '&back=' + encodeURIComponent(back);
  }
  function page(u){ var m = /([\w\-]+\.html)(#[^\s]*)?$/.exec(u || ''); return m ? m[1] + (m[2] || '') : ''; }
  if (RX.test(location.hash)) {
    var ref = page(document.referrer);
    location.replace(url(location.hash, ref && ref.indexOf(GATE + '.html') !== 0 ? ref : GATE + '.html'));
  }
  window.addEventListener('hashchange', function(e){
    if (!RX.test(location.hash)) return;
    e.stopImmediatePropagation();
    var old = (e.oldURL || '').split('#')[1] || '';
    var dest = url(location.hash, GATE + '.html' + (old ? '#' + old : ''));
    history.replaceState(null, '', old ? '#' + old : location.pathname + location.search);
    location.href = dest;
  });
})();
</script>
<!-- est-workbook-hook:end -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F6F6F3;--surface:#FFFFFF;--line:#E6E5DF;--line2:#EFEEE9;--ink:#1B1B18;--sub:#66655E;--faint:#9A9990;
  --acc:#0E6B6B;--acc-w:#E2F0EF;--acc-d:#0A5252;
  --req:#0E6B6B;--req-w:#E2F0EF;--site:#2F5BD3;--site-w:#E8EEFC;--due:#C2410C;--due-w:#FDECE3;
  --tcm:#4B5563;--tcm-w:#EEEFF2;--won:#15803D;--won-w:#E6F4EA;--lost:#8A8A84;--lost-w:#F0F0EC;--ai:#6D28D9;--ai-w:#F2ECFD;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{color:var(--acc-d)}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;min-height:60px;flex-wrap:wrap}
.introbtn{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:13px}
.introbtn:hover{background:#ECEBE6;color:var(--ink)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;font-style:normal;font-size:13px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;color:var(--sub);font-weight:500;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.cnt{font-size:11px;font-weight:700;background:var(--due);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}
.topr{margin-left:auto;display:flex;gap:8px;align-items:center}
.search{min-height:40px;width:260px;max-width:40vw;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font:inherit;font-size:13px}
.aibtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--ai);background:var(--ai-w);color:var(--ai);font-weight:700;cursor:pointer}
.aibtn.on{background:var(--ai);color:#fff}
.wrap{max-width:1440px;margin:0 auto;padding:22px 24px 80px}
.h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.h h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.h .s{color:var(--sub);font-size:13px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.ch h2{margin:0;font-size:14px;font-weight:700}
.cb{padding:14px 16px}
.muted{color:var(--sub)}.faint{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:#CFCEC6}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#000}
.btn.sm{min-height:34px;padding:0 10px;font-size:12px}
.seg{display:inline-flex;background:#ECEBE6;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;min-height:34px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.t-req{background:var(--req-w);color:var(--req)}.t-site{background:var(--site-w);color:var(--site)}.t-due{background:var(--due-w);color:var(--due)}
.t-tcm{background:var(--tcm-w);color:var(--tcm)}.t-won{background:var(--won);color:#fff}.t-lost{background:var(--lost-w);color:#5E5E58}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.ai{font-size:11px;font-weight:800;color:var(--ai);letter-spacing:.02em}
.num{text-align:right;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--sub);padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:0}
tr.won td{background:var(--won-w)}
tr.won td:first-child{box-shadow:inset 3px 0 0 var(--won)}
.up{color:#B42318}.dn{color:var(--won)}
.scroll{overflow-x:auto}
/* calendar */
.cal{display:grid;grid-template-columns:232px minmax(0,1fr) 340px;gap:16px;align-items:start}
.rail .stat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px}
.rail label{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13px;cursor:pointer}
.rail input{width:16px;height:16px;accent-color:var(--ink)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2);gap:8px;flex-wrap:wrap}
.mhead b{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{padding:8px 10px;font-size:12px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line2)}
.dow.sun{color:#B42318}
.day{min-height:112px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px;display:flex;flex-direction:column;gap:3px}
.day:nth-child(7n){border-right:0}
.day .n{font-size:12px;font-weight:700;color:var(--sub);padding:0 2px}
.day.out .n{color:#C8C7BF}
.day.today{background:#FBFBF4}
.day.today .n{color:#fff;background:var(--ink);border-radius:6px;padding:0 6px;align-self:flex-start}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:3px 6px;font-size:11.5px;font-weight:600;line-height:1.35;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.sel{outline:2px solid var(--ink);outline-offset:1px}
.ev.ghost{background:transparent !important;border:1px dashed currentColor;font-weight:500}
.ev-req{background:var(--req-w);color:var(--req)}.ev-site{background:var(--site-w);color:var(--site)}.ev-due{background:var(--due-w);color:var(--due)}
.ev-tcm{background:var(--tcm-w);color:var(--tcm)}.ev-won{background:var(--won);color:#fff}.ev-lost{background:var(--lost-w);color:#5E5E58}
.more{font-size:11px;color:var(--sub);padding:0 4px}
.drawer{position:sticky;top:76px}
.chain{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.chain div{flex:1;padding:7px 10px;border-right:1px solid var(--line);font-size:12px}
.chain div:last-child{border-right:0}
.chain b{display:block;font-size:12.5px}
.chain .now{background:var(--acc-w)}.chain .off{color:var(--faint)}
.agenda{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px}
.agenda:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line2)}
.kv:last-child{border-bottom:0}
/* heatmap */
.heat td,.heat th{text-align:center;padding:6px 4px;border:0}
.heat td.c{width:7%;}
.cell{display:grid;place-items:center;height:36px;border-radius:7px;font-size:12px;font-weight:700}
.heat th{font-weight:600}
.yr{font-weight:700;text-align:left !important;padding-left:8px !important;white-space:nowrap}
/* bars */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;min-width:0}
.bar .v{font-size:11px;color:var(--sub)}
.stk{width:100%;max-width:30px;display:flex;flex-direction:column}
.stk .r{background:#BFD9D7;border-radius:4px 4px 0 0}.stk .w{background:var(--won)}
.lbls{display:flex;gap:8px;margin-top:6px}
.lbls span{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.hb{display:grid;grid-template-columns:86px 1fr 36px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.hb .t{height:10px;border-radius:5px;background:#ECEBE6;overflow:hidden}
.hb .f{height:100%;background:var(--acc);border-radius:5px}
/* customers */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ccard{display:block;text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ccard.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ccard .nm{font-weight:800;font-size:15px}
.spark{display:flex;align-items:flex-end;gap:2px;height:28px;margin:8px 0}
.spark i{flex:1;background:#BFD9D7;border-radius:2px 2px 0 0}
.spark i.w{background:var(--won)}
.yrchip{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:5px;background:var(--won);color:#fff;margin:0 3px 3px 0}
/* deal */
.deal{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line2)}
.steps div{padding:12px 14px;border-right:1px solid var(--line2);font-size:13px}
.steps div:last-child{border-right:0}
.steps .k{font-size:11px;font-weight:800;color:var(--faint)}
.steps .done .k{color:var(--won)}.steps .now{background:var(--acc-w)}.steps .now .k{color:var(--acc)}
.tl{position:relative;padding:6px 16px 6px 40px}
.tl:before{content:"";position:absolute;left:23px;top:0;bottom:0;width:2px;background:var(--line)}
.ti{position:relative;padding:10px 0}
.ti:before{content:"";position:absolute;left:-22px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--won)}
.ti.todo:before{border-color:var(--faint)}
.ti.next:before{border-color:var(--due);background:var(--due-w)}
.ti .d{font-size:12px;color:var(--sub);font-weight:600}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em}
/* ai drawer */
.aid{position:fixed;top:61px;right:0;bottom:0;width:400px;max-width:100vw;background:var(--surface);border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;box-shadow:-12px 0 24px rgba(0,0,0,.06)}
.aid .bd{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#FAFAF8}
.bub{border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.6;max-width:92%}
.bub.q{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.src{display:inline-block;font-size:11px;font-weight:700;color:var(--ai);background:var(--ai-w);border-radius:4px;padding:0 5px;margin:2px 3px 0 0}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer;text-align:left}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#gate{position:fixed;left:14px;bottom:14px;z-index:50;background:var(--ink);color:#fff;font-weight:700;font-size:12px;padding:9px 12px;border-radius:999px}
#gate b{color:#8FD3CF;margin-right:6px}
#gate:hover{color:#fff;background:#000}
@media (max-width:1180px){.cal{grid-template-columns:1fr}.drawer{position:static}.deal{grid-template-columns:1fr}.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.cgrid{grid-template-columns:1fr}.day{min-height:84px}.ev{font-size:10.5px}.search{display:none}.steps{grid-template-columns:repeat(2,1fr)}}

.es{--es-acc:#2457C5;--es-line:#E4E6EB;--es-line2:#EEF0F3;--es-sub:#626875;--es-won:#067647;--es-warn:#B54708;--es-warn-w:#FEF3E8;--es-ai:#6D28D9;--es-ai-w:#F3EEFD;display:flex;flex-direction:column;gap:16px;color:#141518;font-size:13.5px;line-height:1.5}
.es *{box-sizing:border-box}
.es a{color:var(--es-acc);text-decoration:none}
.es-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.es-top h1{margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.es-crumb{font-size:12.5px;color:var(--es-sub)}
.es-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.es-kind{display:inline-flex;background:#ECEEF2;border-radius:10px;padding:3px;gap:2px}

.es-kind a.on{background:#fff;color:#141518 !important;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.es-card{background:#fff;border:1px solid var(--es-line);border-radius:14px;overflow:hidden}
.es-ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--es-line2);flex-wrap:wrap}
.es-ch h2{margin:0;font-size:14.5px;font-weight:800}
.es-ch h2 span{font-weight:600;color:var(--es-sub);font-size:12.5px;margin-left:6px}
.es-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.es-meta div{padding:12px 16px;border-right:1px solid var(--es-line2);border-bottom:1px solid var(--es-line2)}
.es-meta div:nth-child(4n){border-right:0}
.es-meta dt{font-size:11.5px;color:var(--es-sub)}
.es-meta dd{margin:2px 0 0;font-weight:700}
.es-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.es-scroll{overflow-x:auto}.es-scroll table.es-wide{min-width:1120px}.es-wide td:first-child,.es-wide td:nth-child(2){white-space:nowrap}
.es table{border-collapse:collapse;width:100%;font-size:12.5px}
.es th{text-align:left;font-weight:700;font-size:11.5px;color:var(--es-sub);padding:8px 10px;border-bottom:1px solid var(--es-line);background:#F8F9FA;white-space:nowrap}
.es td{padding:8px 10px;border-bottom:1px solid var(--es-line2);vertical-align:top}
.es td.n,.es th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.es tr.g td{background:#F4F5F7;font-weight:800;font-size:12px}
.es tr.st td{font-weight:800;background:#FAFAFB}
.es tr.tot td{font-weight:800;background:#141518;color:#fff;border-bottom:0}
.es tr.hl td{background:#F5F8FF}
.es .src{font-size:11px;color:var(--es-sub)}
.es .warn{display:inline-block;font-size:11px;font-weight:800;color:var(--es-warn);background:var(--es-warn-w);border-radius:999px;padding:0 7px}
.es .okt{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--es-won);border-radius:999px;padding:0 7px}
.es .pick{font-weight:800;color:var(--es-won)}
.es .out{color:#A0A4AE}
.es-sum{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.es-big{padding:16px}
.es-big .l{font-size:12px;color:var(--es-sub)}
.es-big .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

@media (max-width:1100px){.es-cols{grid-template-columns:1fr}.es-sum{position:static}.es-meta{grid-template-columns:repeat(2,minmax(0,1fr))}.es-meta div:nth-child(2n){border-right:0}}

.es{--es-acc:#0E6B6B}
.rolef{margin-top:28px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:13.5px;line-height:1.7}.rolef .rk{flex:none;font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:6px;padding:3px 8px}.rolef .rt{flex:1;min-width:240px}.rolef b{display:block;font-size:14.5px;margin-bottom:2px}

<body>
<header class="top"><div class="topin">
  <a class="introbtn" href="index.html">← 인트로</a><div class="logo"><i>영</i>영업 데스크</div>
  <nav class="tabs" id="tabs" aria-label="주 메뉴"></nav>
  <div class="topr">
    <label for="q" style="position:absolute;left:-9999px">검색</label>
    <input id="q" class="search" type="search" placeholder="프로젝트 · 고객사 · 문서 검색">
    <button class="aibtn" id="aibtn" type="button" data-act="ai">AI에게 묻기</button>
  </div>
</div></header>
<main class="wrap" id="view"></main>

  LABOR.map(function(r){return '<tr>'+r.map(function(c,i){return '<td class="'+(i?'num':'')+(i>=8?(c[0]=='+'?' up':' dn'):'')+'">'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div><div class="cb" style="border-top:1px solid var(--line2);font-size:13px"><span class="ai">AI</span>&nbsp; 차이의 70%는 용접 생산성(인공)입니다. 실적 인공은 수주 4건(2019~2025) 실행 평균 0.085로, 품셈 대비 보정률 0.85입니다. 시중노임·사내 단가는 예시 값입니다.</div></section>'}
 if(S.costTab=='rate'){var R=[['용접공',228,241,252,263,272,280],['배관공',210,220,229,238,245,250],['비계공',225,236,246,254,260,270]];body='<section class="card"><div class="ch"><h2>사내 노무단가 이력 (천원/인)</h2><span class="faint" style="font-size:12px">반기 갱신 · 예시 값</span></div><div class="scroll"><table><thead><tr><th>직종</th><th class="num">2022</th><th class="num">2023</th><th class="num">2024</th><th class="num">2025</th><th class="num">2026</th><th class="num">2026 시중노임</th><th class="num">5년 상승</th></tr></thead><tbody>'+R.map(function(r){return '<tr><td><b>'+r[0]+'</b></td>'+r.slice(1,6).map(function(v){return '<td class="num">'+v+'</td>'}).join('')+'<td class="num">'+r[6]+'</td><td class="num up">+'+((r[5]/r[1]-1)*100).toFixed(1)+'%</td></tr>'}).join('')+'</tbody></table></div></section>'}
 if(S.costTab=='mat'){var m=MATS[S.mat],mx=Math.max.apply(null,m[7]),mn=Math.min.apply(null,m[7]);body='<div class="deal"><section class="card"><div class="scroll"><table><thead><tr><th>자재 코드</th><th>품명 · 규격</th><th>단위</th><th class="num">최근 단가</th><th>기준 · 출처</th><th class="num">1년</th><th class="num">사용 견적</th></tr></thead><tbody>'+MATS.map(function(r,i){return '<tr style="cursor:pointer;'+(i==S.mat?'background:var(--acc-w)':'')+'" data-act="mat" data-i="'+i+'"><td style="font-size:12px;font-weight:700">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="num">'+r[3]+'</td><td>'+r[4]+'</td><td class="num '+(r[5][0]=='+'?'up':(r[5][0]=='−'?'dn':''))+'">'+r[5]+'</td><td class="num">'+r[6]+'</td></tr>'}).join('')+'</tbody></table></div></section>'+
  '<section class="card"><div class="ch"><h2>'+m[1]+'</h2></div><div class="cb"><div class="muted" style="font-size:12px;margin-bottom:6px">단가 추이 (최근 5분기)</div><div class="bars" style="height:120px">'+m[7].map(function(v){var hh=mx==mn?60:Math.round(30+(v-mn)/(mx-mn)*70);return '<div class="bar"><span class="v">'+v+'</span><div style="width:100%;max-width:30px;height:'+hh+'px;background:#BFD9D7;border-radius:4px 4px 0 0"></div></div>'}).join('')+'</div><div class="lbls"><span>25.10</span><span>26.01</span><span>26.04</span><span>26.07</span><span>26.10</span></div>'+
  '<div class="kv" style="margin-top:10px"><span class="muted">표준 할증률</span><b>5%</b></div><div class="kv"><span class="muted">주 공급사</span><b>[공급사] · AVL</b></div><div class="kv"><span class="muted">사용 견적</span><b>'+m[6]+'건</b></div><button class="btn" type="button" data-act="toast" data-m="AVL 업체에 가격 요청을 보냅니다 (프로토타입)" style="margin-top:10px;width:100%">AVL 업체에 가격 요청</button></div></section></div>'}
 return '<div class="h"><div><h1>비용·자재</h1><div class="s">견적마다 쌓이는 노무·자재 단가 이력 · 예시 데이터</div></div>'+seg+'</div>'+body;
}

/* ---------- 승인 ---------- */

 var a=APPROVALS.filter(function(x){return x.k==S.ap})[0];var done=S.apDone[a.k];
 var list=APPROVALS.map(function(x){var d=S.apDone[x.k];return '<button type="button" data-act="ap" data-k="'+x.k+'" class="ccard'+(x.k==S.ap?' on':'')+'" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px">'+tag(x.kind=='참여'?'site':'due',x.kind+' 승인')+(d?'<span class="tag t-won">'+d+'</span>':'<span class="muted" style="font-size:12px">'+x.due+'</span>')+'</div><div style="font-weight:700;margin-top:6px">'+x.title+'</div><div class="muted" style="font-size:12px">'+x.id+' · '+x.hint+'</div></button>'}).join('');
 return '<div class="h"><div><h1>승인</h1><div class="s">임원 결재 · 과거 이력과 나란히 보고 결정</div></div></div><div class="deal" style="grid-template-columns:340px minmax(0,1fr)"><div>'+list+'</div>'+
  '<section class="card"><div class="cb"><div class="muted" style="font-size:13px">'+a.id+' · '+a.due+'</div><h2 style="margin:4px 0 0;font-size:20px">'+a.title+'</h2></div>'+
  (done?'<div class="cb" style="background:var(--won-w);border-top:1px solid var(--line2);font-weight:700;color:var(--won)">'+done+' 처리했습니다 · 상태와 결재 이력에 기록됨 (프로토타입)</div>':'')+
  '<div class="cb" style="border-top:1px solid var(--line2)">'+a.rows.map(function(r){return '<div class="kv"><span class="muted">'+r[0]+'</span><span style="text-align:right"><b>'+r[1]+'</b><div class="muted" style="font-size:12px">'+r[2]+'</div></span></div>'}).join('')+'</div>'+
  (a.k=='a1'?'<div class="cb" style="border-top:1px solid var(--line2)">'+serBars()+'</div>':'')+
  '<div class="cb" style="border-top:1px solid var(--line2)"><label for="op" style="font-size:12px;font-weight:700;color:var(--sub)">결재 의견</label><textarea id="op" rows="2" style="width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px"></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap"><button class="btn" type="button" data-act="apdo" data-v="반려" style="color:#B42318">반려</button><button class="btn" type="button" data-act="apdo" data-v="조건부 승인">조건부 승인</button><button class="btn pri" type="button" data-act="apdo" data-v="승인">승인</button></div></div></section></div>';

/* ---------- AI 패널 ---------- */
function aiPanel(){
 var el=document.getElementById('aid');document.getElementById('aibtn').classList.toggle('on',S.ai);
 if(!S.ai){el.innerHTML='';return}
 el.innerHTML='<aside class="aid" aria-label="AI 질문"><div class="ch"><div><h2>AI에게 묻기</h2><div class="faint" style="font-size:12px">권한: 담당 · 대외비(마진·실행예산)는 검색하지 않음</div></div><button class="btn sm" type="button" data-act="ai">닫기</button></div>'+
  '<div class="bd" id="aibd">'+(S.chat.length?S.chat.map(function(m){return '<div class="bub '+m[0]+'">'+m[1]+(m[2]?'<div>'+m[2].map(function(s){return '<span class="src">'+s+'</span>'}).join('')+'</div>':'')+'</div>'}).join(''):'<div class="muted" style="font-size:13px">공용 드라이브 문서, 10년 요청 이력, 견적·비용 이력에서 찾아 근거와 함께 답합니다.</div>')+
  '<div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">'+AIQA.map(function(q,i){return '<button type="button" class="chip" data-act="ask" data-i="'+i+'">'+q[0]+'</button>'}).join('')+'</div></div>'+
  '<form class="cb" data-act="askf" style="border-top:1px solid var(--line);display:flex;gap:8px"><label for="aiq" style="position:absolute;left:-9999px">질문</label><input id="aiq" placeholder="질문을 입력하세요" style="flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit"><button class="btn pri" type="submit" style="min-height:44px">보내기</button></form></aside>';
 var bd=document.getElementById('aibd');bd.scrollTop=bd.scrollHeight;
}

function render(){
 var r=(location.hash||'#cal').slice(1);S.route=['cal','inbox','history','customers','deal','cost','approve','est-civil','est-tank'].indexOf(r)>=0?r:'cal';
 tabs();var v=(S.route.indexOf('est-')==0?document.getElementById('tpl-'+S.route).innerHTML:{cal:vCal,inbox:vInbox,history:vHistory,customers:vCustomers,deal:vDeal,cost:vCost,approve:vApprove}[S.route]())+roleFoot(S.route);
 document.getElementById('view').innerHTML=v;aiPanel();
}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
 if(el.tagName=='INPUT'||el.tagName=='FORM')return;
 if(a=='ev'){var i=+el.getAttribute('data-i');S.sel=(S.sel===i?null:i);render()}
 else if(a=='close'){S.sel=null;render()}
 else if(a=='cust'){S.cust=el.getAttribute('data-c');if(location.hash=='#customers')render();else location.hash='customers'}
 else if(a=='heat'){S.heat=el.getAttribute('data-c');if(el.getAttribute('data-go'))location.hash='history';else render()}
 else if(a=='basis'){S.basis=el.getAttribute('data-b');render()}
 else if(a=='ctab'){S.costTab=el.getAttribute('data-t');render()}
 else if(a=='mat'){S.mat=+el.getAttribute('data-i');render()}
 else if(a=='ap'){S.ap=el.getAttribute('data-k');render()}
 else if(a=='apdo'){S.apDone[S.ap]=el.getAttribute('data-v');render();toast(el.getAttribute('data-v')+' 처리했습니다')}
 else if(a=='inbox'){var id=+el.getAttribute('data-id');var m=INBOX.filter(function(x){return x.id==id})[0];S.inbox[id]=1;EVENTS.push({d:m.d,t:m.t,title:m.title,cust:m.cust,id:'RV-2026-01'+(51+id),st:'접수'});render();toast('캘린더 '+md(m.d)+'에 등록하고 검토 ID를 만들었습니다')}
 else if(a=='ai'){S.ai=!S.ai;aiPanel()}
 else if(a=='ask'){var q=AIQA[+el.getAttribute('data-i')];S.chat.push(['q',q[0]],['a',q[1],q[2]]);aiPanel()}
 else if(a=='toast'){toast(el.getAttribute('data-m'))}
 else if(el.tagName=='BUTTON'&&el.parentElement.classList.contains('seg')){}
});
document.addEventListener('change',function(e){var el=e.target;var a=el.getAttribute('data-act');
 if(a=='type'){S.types[el.getAttribute('data-t')]=el.checked?1:0;render()}
 if(a=='ghost'){S.ghost=el.checked;render()}});
document.addEventListener('submit',function(e){if(e.target.getAttribute('data-act')!='askf')return;e.preventDefault();var v=document.getElementById('aiq').value.trim();if(!v)return;S.chat.push(['q',v],['a','프로토타입에서는 아래 예시 질문에만 답합니다. 실제 시스템에서는 권한 안의 문서·이력에서 찾아 근거와 함께 답합니다.',null]);aiPanel()});
document.addEventListener('click',function(e){var b=e.target.closest('.seg button');if(b&&!b.hasAttribute('data-act')){Array.prototype.forEach.call(b.parentElement.children,function(x){x.classList.remove('on')});b.classList.add('on')}});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
render();
})();
</script>
